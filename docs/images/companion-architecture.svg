<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title description">
  <title id="title">PDF assistant and Qwen on Azure Local: deployment overview</title>
  <desc id="description">Browser and optional Python chat access Azure Local through Azure Arc. The assistant-demo namespace contains FastAPI with React, MiniLM embeddings, Qdrant, a document helper and indexing Jobs, and persistent PDF and vector volumes. The existing Foundry Local namespace serves Qwen 0.5B and 14B. Azure Container Registry supplies images and external model assets are used during provisioning, not inference. Solid arrows show application requests, dashed arrows show indexing or provisioning, and lines without arrows show storage mounts. Platform internals are intentionally omitted.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #25364a; }
      .title { font-size: 28px; font-weight: 650; }
      .subtitle { font-size: 16px; fill: #596b7c; }
      .heading { font-size: 21px; font-weight: 600; }
      .label { font-size: 18px; font-weight: 600; }
      .body { font-size: 16px; }
      .note { font-size: 14px; fill: #596b7c; }
      .zone { fill: #f5f9fc; stroke: #7395b4; stroke-width: 1.5; }
      .card { fill: #fff; stroke: #9eb4c9; stroke-width: 1.5; }
      .model { fill: #fff5ec; stroke: #d69466; stroke-width: 1.5; }
      .storage { fill: #f1f7f0; stroke: #85a080; stroke-width: 1.5; }
      .request { fill: none; stroke: #346d9b; stroke-width: 2.5; marker-end: url(#blue); }
      .index { fill: none; stroke: #58864c; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#green); }
      .provision { fill: none; stroke: #95683e; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#brown); }
      .mount { fill: none; stroke: #85a080; stroke-width: 2; }
    </style>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#346d9b"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#58864c"/></marker>
    <marker id="brown" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#95683e"/></marker>
  </defs>
  <rect width="1200" height="1220" fill="#fff"/>
  <text x="32" y="43" class="title">PDF assistant + Qwen on Azure Local</text>
  <text x="32" y="73" class="subtitle">Deployment overview / components and responsibilities, not a packet or node-placement map</text>

  <rect x="32" y="105" width="540" height="120" rx="8" class="card"/>
  <text x="52" y="135" class="heading">Developer computer</text>
  <text x="52" y="166" class="body">Browser: PDF assistant at localhost:8080</text>
  <text x="52" y="193" class="body">Optional standard-library Python chat: localhost:5000</text>
  <rect x="652" y="105" width="516" height="120" rx="8" class="card"/>
  <text x="672" y="135" class="heading">Azure provisioning services</text>
  <text x="672" y="166" class="body">Approved ACR: remote builds + container images</text>
  <text x="672" y="193" class="body">Foundry catalog + model assets: initial provisioning</text>

  <rect x="32" y="274" width="540" height="102" rx="8" class="card"/>
  <text x="52" y="306" class="heading">Connected Azure Arc access</text>
  <text x="52" y="337" class="body">Local Arc proxy + Cluster Connect + kubectl port-forward</text>
  <text x="52" y="359" class="note">Entra sign-in / cluster RBAC; cloud-mediated access, not inference</text>
  <path d="M302 225 V274" class="request"/>
  <text x="317" y="253" class="note">Browser / CLI traffic</text>

  <rect x="32" y="440" width="1136" height="650" rx="10" class="zone"/>
  <text x="52" y="473" class="heading">Azure Local / Arc-enabled Kubernetes / on-premises appliance</text>
  <text x="52" y="499" class="note">PDF parsing, embeddings, vector search and model inference run here.</text>
  <path d="M302 376 V410 H16 V608 H72" class="request"/>
  <text x="318" y="415" class="note">UI + same-origin API</text>
  <path d="M910 225 V440" class="provision"/>
  <text x="927" y="314" class="note">Image pulls +</text>
  <text x="927" y="337" class="note">model downloads</text>
  <text x="927" y="360" class="note">(not chat responses)</text>

  <rect x="52" y="522" width="650" height="430" rx="8" class="card"/>
  <text x="72" y="550" class="heading">assistant-demo / PDF assistant + local RAG services</text>
  <rect x="72" y="565" width="610" height="86" rx="6" class="card"/>
  <text x="92" y="596" class="label">assistant-web / FastAPI + built React UI</text>
  <text x="92" y="625" class="body">Questions, scenarios, history, citations, tokens + SLM exchanges</text>

  <rect x="72" y="698" width="280" height="82" rx="6" class="card"/>
  <text x="92" y="729" class="label">embeddings / MiniLM</text>
  <text x="92" y="758" class="body">Local text-to-vector API</text>
  <rect x="402" y="698" width="280" height="82" rx="6" class="card"/>
  <text x="422" y="729" class="label">qdrant / vector database</text>
  <text x="422" y="758" class="body">Isolated scenario snapshots</text>
  <path d="M212 651 V698" class="request"/>
  <text x="225" y="679" class="note">Embed question</text>
  <path d="M542 651 V698" class="request"/>
  <text x="555" y="679" class="note">Retrieve passages</text>

  <rect x="72" y="834" width="280" height="93" rx="6" class="card"/>
  <text x="92" y="864" class="label">documents + pdf-index Jobs</text>
  <text x="92" y="891" class="body">Upload, parse + index PDFs</text>
  <text x="92" y="913" class="note">Publish only after successful indexing</text>
  <path d="M212 834 V780" class="index"/>
  <text x="225" y="810" class="note">Embed PDF text</text>
  <path d="M352 880 H375 V803 H542 V780" class="index"/>
  <text x="402" y="825" class="note">Write new snapshot;</text>
  <text x="402" y="849" class="note">switch active index atomically</text>

  <rect x="72" y="981" width="280" height="81" rx="6" class="storage"/>
  <text x="92" y="1012" class="label">PDF storage / 2 GiB PVC</text>
  <text x="92" y="1040" class="body">Persistent source documents</text>
  <path d="M212 927 V981" class="mount"/>
  <rect x="402" y="981" width="280" height="81" rx="6" class="storage"/>
  <text x="422" y="1012" class="label">Vector storage / 5 GiB PVC</text>
  <text x="422" y="1040" class="body">Azure Local CSI volumes</text>
  <path d="M682 739 H713 V965 H542 V981" class="mount"/>

  <rect x="778" y="522" width="370" height="430" rx="8" class="card"/>
  <text x="798" y="550" class="heading">foundry-local-operator</text>
  <text x="798" y="580" class="note">Existing shared model platform</text>
  <rect x="798" y="650" width="330" height="80" rx="6" class="model"/>
  <text x="818" y="681" class="label">Qwen2.5 0.5B / default</text>
  <text x="818" y="709" class="body">Dedicated CPU model-serving pod</text>
  <rect x="798" y="750" width="330" height="80" rx="6" class="model"/>
  <text x="818" y="781" class="label">Qwen2.5 14B / selectable</text>
  <text x="818" y="809" class="body">Dedicated CPU model-serving pod</text>
  <text x="798" y="867" class="body">Operator + local model store/cache</text>
  <text x="798" y="896" class="note">Certificates, API keys + model Services</text>
  <text x="798" y="922" class="note">Controllers provision; serving pods infer.</text>
  <path d="M682 610 H749 V690 H798" class="request"/>
  <path d="M749 690 V790 H798" class="request"/>
  <text x="798" y="613" class="note">Selected model / authenticated HTTPS</text>
  <rect x="778" y="981" width="370" height="81" rx="6" class="card"/>
  <text x="798" y="1012" class="label">Shared cluster infrastructure</text>
  <text x="798" y="1040" class="body">Arc agents, DNS, CNI, CSI, certificates</text>

  <path d="M52 1124 H90" class="request"/><text x="102" y="1130" class="note">Application request</text>
  <path d="M300 1124 H338" class="index"/><text x="350" y="1130" class="note">Indexing / publication</text>
  <path d="M565 1124 H603" class="provision"/><text x="615" y="1130" class="note">Provisioning only</text>
  <path d="M830 1124 H868" class="mount"/><text x="880" y="1130" class="note">Storage mount</text>
  <text x="52" y="1165" class="body">Browser access is connected through Azure Arc; this is not an air-gapped deployment.</text>
  <text x="52" y="1193" class="note">Python chat forwards directly to the 0.5B model, bypassing the PDF app. See architecture-detail.svg for its transport hops.</text>
</svg>
